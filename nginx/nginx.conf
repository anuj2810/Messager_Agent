# ============================================================
# AI Messenger Agent - Nginx Production Configuration
# ============================================================
# Ref: Architecture §9 - TLS termination, rate limiting, reverse proxy
# Ref: Security §5.2 - TLS 1.3, HSTS headers
# Ref: Security §9 - CORS restricted, max payload 1MB
# Ref: Tech Stack §5.6 - Nginx rate limit zone
# ============================================================

# Worker settings
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # --- Basic Settings ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Hide Nginx version (Security hardening)

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging Format (JSON for structured logging) ---
    # Ref: Tech Stack §4.1 - Structured logging
    log_format json_log escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_log;

    # --- Rate Limiting ---
    # Ref: Security §7, §9 - Rate limit per IP: 60 req/min
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=120r/m;
    limit_req_status 429;

    # --- Connection Limiting ---
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --- Upstream (FastAPI App) ---
    upstream fastapi_app {
        server app:8000;
        keepalive 32;
    }

    # ============================================================
    # HTTP Server - Redirect to HTTPS (Production)
    # ============================================================
    server {
        listen 80;
        server_name _;

        # Health check bypass (no redirect)
        location /health {
            proxy_pass http://fastapi_app;
        }

        # WhatsApp webhook verification (must work on HTTP for initial setup)
        location /webhook/whatsapp {
            # Allow GET for verification, POST for messages
            limit_req zone=webhook_limit burst=30 nodelay;
            limit_conn conn_limit 20;

            # Max payload - Security §7
            client_max_body_size 1m;

            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }

        # In production, redirect everything else to HTTPS
        # Uncomment the line below when TLS is configured:
        # return 301 https://$host$request_uri;

        # --- Agent API Endpoints (Development: HTTP) ---
        location /agent/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;

            client_max_body_size 1m;

            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Block all other routes
        location / {
            return 404;
        }
    }

    # ============================================================
    # HTTPS Server (Production - uncomment when TLS cert available)
    # ============================================================
    # Ref: Security §5.2 - TLS 1.3, strong ciphers
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     # --- TLS Configuration ---
    #     # Ref: Security §5.2 - TLS 1.3 only
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.3;
    #     ssl_ciphers EECDH+AESGCM:EDH+AESGCM;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     ssl_session_tickets off;
    #
    #     # --- Security Headers ---
    #     # Ref: Security §9 - HSTS, content security
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-Frame-Options "DENY" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #     add_header Content-Security-Policy "default-src 'self'" always;
    #
    #     # --- Max Payload ---
